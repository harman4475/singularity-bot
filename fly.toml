# fly.toml app configuration file generated for singularity-bot on 2026-10-30T22:49:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'singularity-bot'
primary_region = 'fra'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[processes]
  app = 'python bot.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
